<!-- INCLUDE flying_fleets -->
<script type="text/javascript">
(function () {
  var blocked = {ZERO_ACS_BLOCKED_JSON};
  var buttons = document.querySelectorAll('input[onclick*="fleet_page=4&fleetid="]');
  for (var i = 0; i < buttons.length; i++) {
    var match = /fleetid=(\d+)/.exec(buttons[i].getAttribute('onclick'));
    if (match && blocked.indexOf(Number(match[1])) !== -1) {
      var previous = buttons[i].previousElementSibling;
      if (previous && previous.tagName === 'BR') { previous.parentNode.removeChild(previous); }
      buttons[i].parentNode.removeChild(buttons[i]);
    }
  }
}());
</script>
